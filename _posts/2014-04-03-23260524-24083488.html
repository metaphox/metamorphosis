---
title: 给div加什么css样式能够保证鼠标划选文字的时候出现的蓝色区域只限制在div内？
layout: post
---
鼠标高亮选中文字的反白范围最终还是浏览器决定的。你说的问题通常只在 WebKit 核心的桌面浏览器上存在。一般 overflow:hidden; 可以缓解此症状。<br><br>Chrome：<br><br><img src="https://pic4.zhimg.com/e0b3b949156d4a9983ae867162d52a2b_r.jpg" class="origin_image" width="1055" loading="lazy" referrerpolicy="no-referrer"><br>Firefox：<br><img src="https://pic2.zhimg.com/adc2a548498189cb9f7d632eb1d3b915_r.jpg" class="origin_image" width="999" loading="lazy" referrerpolicy="no-referrer"><br>Chrome 中给该 div 加上 overflow:hidden; ：<br><br><img src="https://pic4.zhimg.com/730828cee0e6f193b1a766b0396bb78f_r.jpg" class="origin_image" width="945" loading="lazy" referrerpolicy="no-referrer"><br>具体原因待考。
